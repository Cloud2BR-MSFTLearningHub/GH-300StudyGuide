name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - '**/*.md'
      - docs/**
      - mkdocs.yml
      - .github/workflows/deploy-pages.yml
      - requirements.txt
      - scripts/**
      - labs/**
  pull_request:
    paths:
      - '**/*.md'
      - docs/**
      - mkdocs.yml
      - .github/workflows/deploy-pages.yml
      - requirements.txt
      - scripts/**
      - labs/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install documentation dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate original practice materials
        run: python scripts/validate_study_material.py
      - name: Test practical lab
        run: python -m unittest discover -s labs/copilot-practice -p "test_*.py"
      - name: Prove regression detection in a temporary copy
        run: python scripts/check_lab_regression.py
      - name: Build site
        run: mkdocs build --strict
      - name: Check generated local links and assets
        run: python scripts/check_site.py
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4