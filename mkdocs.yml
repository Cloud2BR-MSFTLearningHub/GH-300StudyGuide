site_name: GH-300 GitHub Copilot Study Guide
site_description: Practice material and study notes for the Microsoft GitHub Copilot certification.
site_url: https://cloud2br-msftlearninghub.github.io/GH-300StudyGuide/
repo_url: https://github.com/Cloud2BR-MSFTLearningHub/GH-300StudyGuide
repo_name: Cloud2BR-MSFTLearningHub/GH-300StudyGuide
docs_dir: docs
site_dir: site
use_directory_urls: true
copyright: Copyright &copy; 2026 <a href="https://github.com/Cloud2BR-MSFTLearningHub" target="_blank" rel="noopener">Cloud2BR OSS - Learning Hub</a>

theme:
  name: material
  logo: assets/images/cloud2br-logo.png
  favicon: assets/images/cloud2br-logo.png
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - content.code.copy
  palette:
    scheme: default
    primary: blue
    accent: blue

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.highlight
  - pymdownx.snippets:
      check_paths: true
      base_path:
        - .
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_div_format
  - pymdownx.tasklist:
      custom_checkbox: true
  - toc:
      permalink: true

extra_css:
  - assets/css/custom.css
extra_javascript:
  - assets/js/logo-link.js
  - assets/js/external-links.js
  - assets/js/checklists.js
  - path: assets/js/mermaid.js
    type: module
extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Cloud2BR-MSFTLearningHub
      name: Cloud2BR OSS - Learning Hub

nav:
  - Home: index.md
  - Exam Preparation:
      - Study plan and readiness: exam-preparation.md
      - Objective coverage map: objective-map.md
      - Six practical labs: hands-on-labs.md
      - Weighted mock exam: mock-exam.md
  - Microsoft Learn Paths:
      - Fundamentals Part 1: learning-path-part-1.md
      - Fundamentals Part 2: learning-path-part-2.md
  - Study Modules:
      - Responsible AI: responsible-ai.md
      - Copilot features: copilot-features.md
      - Data and architecture: data-architecture.md
      - Prompt engineering: prompt-engineering.md
      - Developer productivity: productivity.md
      - Privacy and safeguards: privacy-safeguards.md
  - Foundation Questions: practice-questions.md